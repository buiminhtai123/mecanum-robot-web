<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mecanum Robot Controller</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
    background: #0d1117;
    color: #fff;
    text-align: center;
    font-family: Arial, sans-serif;
    user-select: none;
    padding: 20px;
}

h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

/* ===== SPEED ===== */
#speed-box {
    margin: 20px 0;
}

#speed-text {
    font-size: 26px;
    font-weight: bold;
}

#spdLabel {
    font-size: 34px;
    color: #ff00ff;
}

.slider {
    width: 350px;
    height: 22px;
    border-radius: 12px;
    accent-color: #ff00ff;
}

.slider::-webkit-slider-thumb {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #ff00ff;
    cursor: pointer;
}

/* ===== CONTROLS ===== */
.row { margin-top: 10px; }

.control-btn {
    width: 110px;
    height: 85px;
    font-size: 32px;
    margin: 8px;
    border-radius: 14px;
    border: none;
    background: #ffffff;
    color: #000;
    cursor: pointer;
}

.control-btn:active {
    transform: scale(0.93);
    background: #ffe27a;
}
</style>
</head>

<body>

<h1>Mecanum Robot Controller</h1>

<!-- ===== SPEED ===== -->
<div id="speed-box">
    <div id="speed-text">
        Tốc độ: <span id="spdLabel">50</span>%
    </div>
    <input type="range" id="speedSlider" min="0" max="100" value="50" class="slider">
</div>

<!-- ===== CONTROLS ===== -->
<div class="row">
    <button class="control-btn" data-cmd="Q">↖</button>
    <button class="control-btn" data-cmd="W">↑</button>
    <button class="control-btn" data-cmd="E">↗</button>
</div>

<div class="row">
    <button class="control-btn" data-cmd="A">←</button>
    <button class="control-btn" data-cmd="R">⟲</button>
    <button class="control-btn" data-cmd="T">⟳</button>
    <button class="control-btn" data-cmd="D">→</button>
</div>

<div class="row">
    <button class="control-btn" data-cmd="Z">↙</button>
    <button class="control-btn" data-cmd="X">↓</button>
    <button class="control-btn" data-cmd="C">↘</button>
</div>

<script>
/* ===== SPEED ===== */
const speedSlider = document.getElementById("speedSlider");
const spdLabel = document.getElementById("spdLabel");

speedSlider.oninput = () => {
    spdLabel.innerText = speedSlider.value;
};

/* ===== MQTT ===== */
const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

client.on("connect", () => {
    console.log("MQTT Connected");
});

/* ===== MOMENTARY CONTROL (NHẤN GIỮ) ===== */
function sendDrive(cmd) {
    const spd = speedSlider.value;
    client.publish("hybrid/cmd", spd == 0 ? "S0" : cmd + spd);
}

function stop() {
    client.publish("hybrid/cmd", "S0");   // ✅ ĐÚNG TOPIC
}

/* ===== GÁN SỰ KIỆN ===== */
document.querySelectorAll("button[data-cmd]").forEach(btn => {
    const cmd = btn.dataset.cmd;

    // PC
    btn.onmousedown = () => sendDrive(cmd);
    btn.onmouseup = stop;
    btn.onmouseleave = stop;

    // Mobile
    btn.ontouchstart = (e) => {
        e.preventDefault();
        sendDrive(cmd);
    };
    btn.ontouchend = stop;
});
</script>


</body>
</html>
