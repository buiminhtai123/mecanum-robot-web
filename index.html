<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mecanum Robot Controller (MQTT)</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
    background: #0d1117;
    color: #ffffff;
    text-align: center;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    font-size: 28px;
}

/* ===== SPEED ===== */
#speed-box {
    margin: 20px 0;
}
#spdLabel {
    font-size: 32px;
    color: #00ffcc;
}
.slider {
    width: 360px;
}

/* ===== STATUS ===== */
#status {
    margin-top: 20px;
    font-size: 18px;
    background: #161b22;
    padding: 15px;
    border-radius: 10px;
}

/* ===== BUTTONS ===== */
.row { margin-top: 10px; }

.control-btn {
    width: 110px;
    height: 85px;
    font-size: 30px;
    margin: 6px;
    border-radius: 14px;
    border: none;
    background: #ffffff;
    color: #000;
    cursor: pointer;
}

.control-btn:active {
    transform: scale(0.92);
    background: #ffdd55;
}
</style>
</head>

<body>

<h1>Mecanum Robot Controller</h1>

<!-- ===== SPEED ===== -->
<div id="speed-box">
    Tốc độ: <span id="spdLabel">50</span> %
    <br>
    <input type="range" id="speedSlider" min="0" max="100" value="50" class="slider">
</div>

<!-- ===== CONTROLS ===== -->
<div class="row">
    <button class="control-btn" data-cmd="FL">↖</button>
    <button class="control-btn" data-cmd="F">↑</button>
    <button class="control-btn" data-cmd="FR">↗</button>
</div>

<div class="row">
    <button class="control-btn" data-cmd="L">←</button>
    <button class="control-btn" data-cmd="RL">⟲</button>
    <button class="control-btn" data-cmd="RR">⟳</button>
    <button class="control-btn" data-cmd="R">→</button>
</div>

<div class="row">
    <button class="control-btn" data-cmd="BL">↙</button>
    <button class="control-btn" data-cmd="B">↓</button>
    <button class="control-btn" data-cmd="BR">↘</button>
</div>

<!-- ===== STATUS (CHỈ HIỂN THỊ VẬN TỐC) ===== -->
<div id="status">
    <div>Vx: <span id="vx">0.00</span> m/s</div>
    <div>Vy: <span id="vy">0.00</span> m/s</div>
    <div>Wz: <span id="wz">0.00</span> rad/s</div>
</div>

<script>
/* ================= SPEED ================= */
const speedSlider = document.getElementById("speedSlider");
const spdLabel = document.getElementById("spdLabel");

speedSlider.oninput = () => {
    spdLabel.innerText = speedSlider.value;
};

/* ================= MQTT ================= */
const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

client.on("connect", () => {
    console.log("MQTT Connected");
    client.subscribe("hybrid/status");
});

/* ================= PARAM ================= */
const V_MAX = 0.6;   // m/s
const W_MAX = 1.5;   // rad/s

function scaleSpeed() {
    return speedSlider.value / 100.0;
}

/* ================= SEND CMD ================= */
function sendCmd(vx, vy, wz) {
    client.publish("hybrid/cmd", JSON.stringify({ vx, vy, wz }));
}

function stop() {
    sendCmd(0, 0, 0);
}

/* ================= COMMAND MAP ================= */
function handleCommand(cmd) {
    const k = scaleSpeed();

    let vx = 0, vy = 0, wz = 0;

    switch (cmd) {
        case "F":  vx =  V_MAX * k; break;
        case "B":  vx = -V_MAX * k; break;
        case "L":  vy =  V_MAX * k; break;
        case "R":  vy = -V_MAX * k; break;

        case "FL": vx =  V_MAX * k; vy =  V_MAX * k; break;
        case "FR": vx =  V_MAX * k; vy = -V_MAX * k; break;
        case "BL": vx = -V_MAX * k; vy =  V_MAX * k; break;
        case "BR": vx = -V_MAX * k; vy = -V_MAX * k; break;

        case "RL": wz =  W_MAX * k; break;
        case "RR": wz = -W_MAX * k; break;
    }

    sendCmd(vx, vy, wz);
}

/* ================= BUTTON EVENTS ================= */
document.querySelectorAll(".control-btn").forEach(btn => {
    const cmd = btn.dataset.cmd;

    btn.onmousedown = () => handleCommand(cmd);
    btn.onmouseup = stop;
    btn.onmouseleave = stop;

    btn.ontouchstart = e => {
        e.preventDefault();
        handleCommand(cmd);
    };
    btn.ontouchend = stop;
});

/* ================= RECEIVE STATUS ================= */
client.on("message", (topic, payload) => {
    if (topic !== "hybrid/status") return;

    const data = JSON.parse(payload.toString());

    document.getElementById("vx").innerText = data.vx.toFixed(2);
    document.getElementById("vy").innerText = data.vy.toFixed(2);
    document.getElementById("wz").innerText = data.wz.toFixed(2);
});
</script>

</body>
</html>
